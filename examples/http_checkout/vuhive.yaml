# yaml-language-server: $schema=https://raw.githubusercontent.com/morphy76/vuhive/main/schemas/vuhive.schema.json
version: "1.0"
default_scenario: http_checkout_flow

scenarios:
  http_checkout_flow:
    # Closed-system concurrency model maintaining a fixed number of concurrent Virtual Users
    type: constant_vus
    vus: 5                # Number of concurrent Virtual Users
    ramp_up: 100ms        # Linear stagger spawn duration
    run_period: 500ms     # Steady-state load generation duration
    ramp_down: 100ms      # Grace period allowing in-flight requests to finish
    vu_timeout: 1s        # Maximum duration allowed per single VU iteration

    # Custom key-value parameters accessible in code via ctx.Param("key")
    params:
      checkout_path: "/checkout"

    # Declarative SLA quality gates evaluated at test completion
    thresholds:
      - metric: vuhive.http.req_duration
        stat: p95
        operator: "<"
        target: "200ms"
      - metric: vuhive.http.req_failed
        stat: rate
        operator: "<="
        target: "0.05"

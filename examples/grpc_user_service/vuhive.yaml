# yaml-language-server: $schema=https://raw.githubusercontent.com/morphy76/vuhive/main/schemas/vuhive.schema.json
version: "1.0"
default_scenario: grpc_user_service_flow

scenarios:
  grpc_user_service_flow:
    # Open-system pacing engine targeting a precise rate of transactions per second (TPS)
    type: arrival_rate
    target_tps: 20        # Target rate: 20 transactions / iterations per second
    max_vus: 20           # Maximum size of bounded worker pool
    ramp_up: 100ms        # Linear rate ramp-up duration
    run_period: 500ms     # Steady-state execution duration
    ramp_down: 100ms      # Grace period allowing in-flight RPCs to complete
    vu_timeout: 1s

    params:
      service_name: "UserService"
      method: "GetUser"

    thresholds:
      - metric: grpc_latency
        stat: p95
        operator: "<"
        target: "100ms"
      - metric: rpc_success_rate
        stat: rate
        operator: ">="
        target: "0.95"
